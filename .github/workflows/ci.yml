name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  backend-test:
    name: Backend Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: apps/api/go.sum

      - name: Go Vet
        working-directory: apps/api
        run: go vet ./...

      - name: Run Unit & Property Tests
        working-directory: apps/api
        run: go test -v -race ./...

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Config
        run: docker compose config

  deploy:
    name: Deploy to GCP & Firebase
    needs: [backend-test, docker-build]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and Push Container via Cloud Build
        run: |
          gcloud builds submit \
            --project=waypoint-510612 \
            --region=asia-southeast1 \
            --config=cloudbuild.yaml \
            --substitutions=_IMAGE_TAG=asia-southeast1-docker.pkg.dev/waypoint-510612/waypoint-repo/waypoint-api:${{ github.sha }} \
            .

      - name: Deploy Backend to Cloud Run
        run: |
          gcloud run deploy waypoint-api \
            --image=asia-southeast1-docker.pkg.dev/waypoint-510612/waypoint-repo/waypoint-api:${{ github.sha }} \
            --region=asia-southeast1 \
            --project=waypoint-510612 \
            --platform=managed \
            --min-instances=0 \
            --max-instances=2 \
            --memory=256Mi \
            --cpu=1 \
            --concurrency=80 \
            --cpu-throttling \
            --allow-unauthenticated \
            --set-env-vars="ENVIRONMENT=production,API_PORT=8080,JWT_SECRET=${{ secrets.JWT_SECRET }},BOOTSTRAP_PASSWORD=${{ secrets.BOOTSTRAP_PASSWORD }},PLAN_MAX_STOPS_PER_TRIP=3,BUSINESS_NOW=2026-06-21T15:00:00+05:30,CORS_ALLOWED_ORIGINS=*,DATABASE_URL=${{ secrets.DATABASE_URL }}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Install Frontend Dependencies & Build
        run: |
          pnpm install --frozen-lockfile=false
          pnpm -r build

      - name: Deploy Frontend to Firebase Hosting
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting --project=waypoint-510612
