services:
  caddy:
    image: caddy:2-alpine
    container_name: waypoint-caddy
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - ml
      - web
    networks:
      - waypoint-net

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: waypoint-api
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - API_PORT=8080
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-waypoint_db}?sslmode=disable
      - JWT_SECRET=${JWT_SECRET:-super-secret-jwt-key-change-in-production-32chars}
      - CORS_ALLOWED_ORIGINS=*
      - ML_SERVICE_URL=http://ml:8000
    depends_on:
      db:
        condition: service_healthy
    networks:
      - waypoint-net

  ml:
    build:
      context: apps/ml
      dockerfile: Dockerfile
    container_name: waypoint-ml
    restart: unless-stopped
    environment:
      - ML_PORT=8000
      - ML_HOST=0.0.0.0
      - MODEL_ENV=production
    networks:
      - waypoint-net

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: waypoint-web
    restart: unless-stopped
    environment:
      - PORT=3000
      - VITE_API_URL=/api/v1
      - VITE_ML_URL=/ml/api/v1
    networks:
      - waypoint-net

  db:
    image: postgres:16-alpine
    container_name: waypoint-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-waypoint_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-waypoint_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - waypoint-net

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  waypoint-net:
    driver: bridge
