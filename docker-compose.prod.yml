services:
  caddy:
    image: caddy:2-alpine
    container_name: waypoint-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    deploy:
      resources:
        limits:
          memory: 64M
    depends_on:
      api:
        condition: service_healthy
      ml:
        condition: service_started
      web:
        condition: service_started
    networks:
      - waypoint-net

  api:
    image: ghcr.io/hesandaliyanage/waypoint-api:latest
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: waypoint-api
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - API_PORT=8080
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-waypoint_db}?sslmode=disable
      - JWT_SECRET=${JWT_SECRET:-super-secret-jwt-key-change-in-production-32chars}
      - DEMO_MODE=${DEMO_MODE:-false}
      - BOOTSTRAP_PASSWORD=${BOOTSTRAP_PASSWORD:-WaypointJudge2026!}
      - PLAN_MAX_STOPS_PER_TRIP=${PLAN_MAX_STOPS_PER_TRIP:-3}
      - BUSINESS_NOW=${BUSINESS_NOW:-2026-06-21T15:00:00+05:30}
      - CORS_ALLOWED_ORIGINS=*
      - ML_SERVICE_URL=http://ml:8000
    volumes:
      - photos:/app/data/photos
      - ./db/seed/data:/app/db/seed/data:ro
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/readyz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
    networks:
      - waypoint-net

  ml:
    image: ghcr.io/hesandaliyanage/waypoint-ml:latest
    build:
      context: apps/ml
      dockerfile: Dockerfile
    container_name: waypoint-ml
    restart: unless-stopped
    environment:
      - ML_PORT=8000
      - ML_HOST=0.0.0.0
      - MODEL_ENV=production
    deploy:
      resources:
        limits:
          memory: 384M
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - waypoint-net

  web:
    image: ghcr.io/hesandaliyanage/waypoint-web:latest
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: waypoint-web
    restart: unless-stopped
    environment:
      - PORT=3000
      - VITE_API_URL=/api/v1
      - VITE_ML_URL=/ml/api/v1
    networks:
      - waypoint-net

  db:
    image: postgres:16-alpine
    container_name: waypoint-db
    restart: unless-stopped
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c work_mem=4MB
      -c max_connections=40
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-waypoint_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-waypoint_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - waypoint-net

volumes:
  pgdata:
  photos:
  caddy_data:
  caddy_config:

networks:
  waypoint-net:
    driver: bridge
